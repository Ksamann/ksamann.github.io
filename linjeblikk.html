<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Linjeblikk">
<meta name="description" content="Se hvor T-banen i Oslo er akkurat nå, beregnet fra sanntidsdata.">
<title>Linjeblikk</title>
<link rel="manifest" href="linjeblikk.webmanifest">
<link rel="icon" href="icons/linjeblikk.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/linjeblikk-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one phone-width column. App bar + line picker on top, scrolling content, tab bar at the bottom. Dark only: an operations screen for the pocket. */
:root{
  color-scheme:dark;
  --bg:#0c0f13; --surface:#151a20; --surface-2:#1d232b; --rule:#262e38;
  --fg:#eef1f4; --muted:#8b95a0; --dim:#4d5661;
  --ok:#5fd16b; --late:#f0b43c; --bad:#ff5d4f;
  --c:#3aaa35;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.appbar{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.appbar h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--f-mono);letter-spacing:.06em;color:var(--ok);white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.6s infinite}
.live.stale{color:var(--late)}
.live.off{color:var(--bad)}
.live.off::before,.live.stale::before{animation:none}
@keyframes blink{50%{opacity:.25}}
.content{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);background:var(--bg);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--dim);padding:6px 0}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--fg)}
.badge{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:#071018;background:var(--c)}
.msg{margin:24px 16px;padding:16px;border-radius:16px;background:var(--surface);color:var(--muted);font-size:15px}
.msg b{color:var(--fg);display:block;margin-bottom:4px}
.banner{margin:0 16px 8px;padding:8px 12px;border-radius:12px;font-size:13px;background:color-mix(in srgb,var(--late) 14%,var(--surface));color:var(--fg)}

/* ---------- line view ---------- */
.linepick{display:flex;gap:10px;padding:0 16px 10px}
.linepick button{width:42px;height:42px;border-radius:50%;border:3px solid var(--lc);color:var(--fg);font:800 19px var(--f-display)}
.linepick button[aria-pressed="true"]{background:var(--lc);color:#071018}
.dirhead{display:grid;grid-template-columns:1fr 78px 78px;gap:0;padding:0 12px 8px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--rule);line-height:1.2}
.dirhead span{min-width:0;text-align:center;overflow-wrap:anywhere}
.dirhead span:first-child{text-align:right;padding-right:12px}
.strip{position:relative;margin:6px 12px 140px}
.strip .trk{position:absolute;top:22px;bottom:22px;width:4px;margin-left:-2px;background:var(--c);border-radius:2px;opacity:.85}
.strip .st{height:44px;display:grid;grid-template-columns:1fr 156px;align-items:center}
.strip .st span{grid-row:1;grid-column:1;font-family:var(--f-display);font-weight:600;font-size:16px;text-align:right;padding-right:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.strip .st i{grid-row:1;grid-column:2;height:12px;margin:0 22px;border-radius:6px;background:var(--bg);border:2.5px solid var(--c);position:relative;z-index:1}
.strip .st.term span{color:var(--fg);font-weight:700}
.train{position:absolute;height:26px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 7px;border-radius:13px;background:var(--fg);color:var(--bg);font:700 11px var(--f-mono);z-index:2;transform:translate(-50%,-50%)}
.train b{font:700 10px var(--f-mono);padding:2px 5px;border-radius:5px;background:var(--ok);color:#071018}
.train b.late{background:var(--late)}
.train b.bad{background:var(--bad)}
.train.sel{box-shadow:0 0 0 3px var(--c),0 0 0 6px var(--bg)}
.train.wait{opacity:.6}
.sheet{position:fixed;left:50%;transform:translateX(-50%);width:min(504px,calc(100% - 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--rule);border-radius:22px;padding:14px 16px 16px;box-shadow:0 -10px 40px rgba(0,0,0,.6);z-index:5;display:flex;flex-direction:column;gap:10px}
.sheet .h{display:flex;align-items:center;gap:10px}
.sheet .h div{flex:1;min-width:0}
.sheet .h b{display:block;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}
.sheet .h small{color:var(--muted);font-size:13px}
.sheet ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sheet li{display:grid;grid-template-columns:1fr auto auto;gap:12px;font-size:15px;padding:3px 0;align-items:baseline}
.sheet li .mono{font:500 14px var(--f-mono)}
.sheet li s{color:var(--dim);font:500 12px var(--f-mono)}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-size:15px}
.logbtn{flex:1;display:flex;align-items:center;justify-content:center;min-height:46px;padding:0 10px;border-radius:14px;background:var(--c);color:#071018;font:800 15px var(--f-display);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;text-align:center}
.sacts{display:flex;gap:8px}
.sbtn{flex:1;min-height:46px;border-radius:14px;background:var(--surface-2);font:700 15px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tiles div{background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:1px}
.tiles small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tiles b{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ok)}
.tiles div+div b{color:var(--fg)}
.tiles b.late{color:var(--late)}
.tiles b.bad{color:var(--bad)}
.tiles em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- network ---------- */
.netview{height:100%;display:flex;flex-direction:column}
.map{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);border-top:1px solid var(--rule)}
.map svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.map svg:active{cursor:grabbing}
.map text{font-family:var(--f-display);font-weight:600;font-size:8.5px;fill:var(--muted)}
.map text.major{fill:var(--fg);font-weight:700;font-size:9.5px}
.map .pulse{animation:pulse 1.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:1;transform:scale(.8)}100%{opacity:.2;transform:scale(1.3)}}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--rule);font-size:20px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px 10px}
.kpi{background:var(--surface);border-radius:12px;padding:6px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.kpi small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.kpi b{font:700 16px var(--f-mono)}
.foot{padding:0 16px 24px;font-size:12px;color:var(--dim)}
/* ---------- my station ---------- */
.stn{padding:4px 16px 120px;display:flex;flex-direction:column;gap:16px}
.fav{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:18px;padding:14px}
.fav b{display:block;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.fav .chg{margin-top:6px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.go{min-width:104px;border-radius:14px;padding:10px 12px;background:var(--surface-2);text-align:center;line-height:1.15}
.go small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.go b{display:block;font:700 24px var(--f-mono);color:var(--ok);margin-top:2px}
.go.now b{color:var(--late)}
.go em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:3px}
.walk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.walk button{width:36px;height:36px;border-radius:10px;background:var(--surface);font-size:20px;font-weight:600;color:var(--fg)}
.walk b{color:var(--fg);font-family:var(--f-mono);min-width:56px;text-align:center}
.grp h3{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grp h3 button{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--dim);padding:6px 0 6px 10px}
.grp h3 button[aria-pressed="true"]{color:var(--late)}
.dep{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.dep:first-of-type{border-top:0}
.dep .t{min-width:0}
.dep .t b{display:block;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep .t small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dep .t small i{font-style:normal;color:var(--fg)}
.dep .t small .lt{color:var(--late)}
.dep .t small .bd{color:var(--bad)}
.dep .m{text-align:right;font:700 24px var(--f-mono);line-height:1}
.dep .m small{display:block;font:500 11px var(--f-mono);color:var(--muted);margin-top:3px}
.dep .m.now{color:var(--ok)}
.prog{grid-column:2/4;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:-2px}
.prog i{display:block;height:100%;border-radius:2px}
.none{color:var(--muted);font-size:14px;padding:8px 0}
.picker{padding:4px 16px 40px;display:flex;flex-direction:column;gap:12px}
.picker input{width:100%;min-height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--rule);color:var(--fg);font:inherit;font-size:17px;padding:12px 14px}
.picker h3{margin:6px 0 0;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0}
.plist button{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--rule);text-align:left;font-family:var(--f-display);font-weight:600;font-size:19px}
.plist button span{flex:1;min-width:0}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%}

/* ---------- stringline ---------- */
.sl{padding:4px 12px 24px}
.seg{display:flex;gap:8px;padding:0 4px 10px}
.seg button{min-height:38px;padding:0 14px;border-radius:12px;background:var(--surface);font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sl svg{display:block;width:100%;height:auto}
.sl text{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}
.sl text.st{font-family:var(--f-display);font-weight:700;font-size:11px;fill:var(--fg)}
.sl .lg{padding:10px 4px 0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
/* phone held sideways: give the map the room */
@media (orientation:landscape) and (max-height:520px){
  .appbar{padding-block:4px 2px}
  .appbar h1{font-size:19px}
  .kpis{display:none}
  .tabs{padding-block:2px calc(2px + env(safe-area-inset-bottom,0px))}
  .tabs button{flex-direction:row;justify-content:center;gap:6px;padding:4px 0}
  .tabs button svg{width:18px;height:18px}
  .zoom{top:auto;bottom:8px;right:auto;left:max(12px,env(safe-area-inset-left,0px));flex-direction:row}
  .zoom button{width:38px;height:38px}
  .sheet{bottom:calc(44px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 60px);overflow:auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="appbar"><h1 id="title">Linjeblikk</h1><span class="live" id="live">KOBLER TIL</span></header>
  <div id="linebar">
    <div class="linepick" id="pick" role="group" aria-label="Velg linje"></div>
    <div class="dirhead"><span>Stasjon</span><span id="dR"></span><span id="dL"></span></div>
  </div>
  <main class="content" id="content"></main>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="line" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><circle cx="12" cy="7" r="2.5" fill="currentColor"/><circle cx="12" cy="17" r="2.5"/></svg>Linje</button>
    <button role="tab" data-tab="net" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M8 12V4M16 12v8"/><circle cx="8" cy="12" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/></svg>Linjekart</button>
    <button role="tab" data-tab="stn" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Stasjon</button>
    <button role="tab" data-tab="sl" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v18M19 3v18"/><path d="M5 6l14 5M5 12l14 5M19 5 5 12"/></svg>Ruteplan</button>
  </nav>
</div>
<div class="sheet" id="sheet" hidden></div>

<script>
"use strict";
/* =====================================================================
   Linjeblikk — where the Oslo metro is right now.
   Data: Entur Journey Planner v3 (open API, CORS enabled). There are no
   GPS positions for the metro, so each train's position is interpolated
   between the last station it left and the next one, using actual and
   expected times.
   ===================================================================== */
const API = "https://api.entur.io/journey-planner/v3/graphql";
const CLIENT = "ksamann-linjeblikk";
const POLL_MS = 20000, NET_TTL = 12*3600e3;
const COLORS = {"1":"#009cdc","2":"#ea5b0b","3":"#a683a5","4":"#3d6fd1","5":"#3aaa35"};
// orientation of each line in the UI (top of the strip = this terminus)
const TERMINI = {"1":["Frognerseteren","Bergkrystallen"],"2":["Østerås","Ellingsrudåsen"],"3":["Kolsås","Mortensrud"],"4":["Vestli","Bergkrystallen"],"5":["Sognsvann","Vestli"]};

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const hm = t => { const d=new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }

async function gql(query){
  const r = await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","ET-Client-Name":CLIENT},body:JSON.stringify({query})});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json(); if(j.errors) throw new Error(j.errors[0].message);
  return j.data;
}

/* ---------- network: lines and their station order ---------- */
let NET = null;   // { lines: {code:{stations:[{id,name}]}}, stopIds:[...] }
async function loadNetwork(){
  const c = store("lb.net");
  if(c && Date.now()-c.at < NET_TTL && c.v===2){ NET=c.net; return; }
  const d = await gql(`{ lines(transportModes:[metro], authorities:["RUT:Authority:RUT"]) { publicCode journeyPatterns { quays { stopPlace { id name } } } } }`);
  const lines={}, ids=new Set();
  for(const l of d.lines){
    if(!COLORS[l.publicCode]) continue;
    // main route: the longest pattern between the line's official termini (others are short turns or diversions)
    const [A,B]=TERMINI[l.publicCode]; let best=[], fallback=[];
    for(const jp of l.journeyPatterns){
      let s=jp.quays.map(q=>({id:q.stopPlace.id,name:q.stopPlace.name})); s.forEach(x=>ids.add(x.id));
      if(s.length>fallback.length) fallback=s;
      if(s[0].name===B && s[s.length-1].name===A) s=s.slice().reverse();
      if(s[0].name===A && s[s.length-1].name===B && s.length>best.length) best=s;
    }
    if(!best.length) best=fallback;
    lines[l.publicCode]={stations:best};
  }
  NET={lines, stopIds:[...ids]};
  store("lb.net",{at:Date.now(),v:2,net:NET});
}

/* ---------- realtime calls ---------- */
let JOURNEYS = [], lastOk = 0, lastErr = null;
async function loadCalls(){
  const start = new Date(Date.now()-8*60e3).toISOString();
  const d = await gql(`{ stopPlaces(ids:${JSON.stringify(NET.stopIds)}) { id estimatedCalls(startTime:"${start}", timeRange:1500, numberOfDepartures:50, whiteListedModes:[metro], includeCancelledTrips:true) {
    stopPositionInPattern aimedArrivalTime expectedArrivalTime actualArrivalTime aimedDepartureTime expectedDepartureTime actualDepartureTime cancellation
    destinationDisplay{frontText} serviceJourney{ id line{publicCode} } } } }`);
  const by = new Map(), T = s => s ? Date.parse(s) : null;
  for(const sp of d.stopPlaces) for(const c of sp.estimatedCalls){
    const id=c.serviceJourney.id;
    if(!by.has(id)) by.set(id,{id, line:c.serviceJourney.line.publicCode, dest:c.destinationDisplay&&c.destinationDisplay.frontText, calls:[]});
    by.get(id).calls.push({stop:sp.id, p:c.stopPositionInPattern, cancel:c.cancellation,
      aArr:T(c.aimedArrivalTime), arr:T(c.actualArrivalTime)||T(c.expectedArrivalTime), aDep:T(c.aimedDepartureTime), dep:T(c.actualDepartureTime)||T(c.expectedDepartureTime),
      actualDep:!!c.actualDepartureTime});
  }
  const out=[];
  for(const j of by.values()){
    const L = NET.lines[j.line]; if(!L) continue;
    j.calls.sort((a,b)=>a.p-b.p);
    const m = mapToLine(j.calls, L.stations); if(!m) continue;
    j.dir=m.dir; j.calls.forEach((c,i)=>c.ix=m.ix[i]);
    out.push(j);
  }
  JOURNEYS = out;
}
// Map a journey's calls (sorted by pattern position) onto the line's station list.
// Tries both directions and every offset; prefers the alignment where pattern position == index (full-length journeys).
function mapToLine(calls, st){
  const n=st.length; let best=null;
  for(const dir of [0,1]){
    const idAt = i => (dir===0 ? st[i] : st[n-1-i]).id;
    for(let o=-calls[0].p; o<n; o++){
      let ok=true;
      for(const c of calls){ const i=c.p+o; if(i<0||i>=n||idAt(i)!==c.stop){ ok=false; break; } }
      if(ok){ const score=Math.abs(o); if(!best||score<best.score) best={dir,o,score}; }
    }
  }
  if(!best) return null;
  return {dir:best.dir, ix:calls.map(c=>{ const i=c.p+best.o; return best.dir===0 ? i : n-1-i; })};
}
// Position of a journey at time t: {pos (fractional index in line order), at (bool), next (call index), delay s} or null.
function stateAt(j,t){
  const cs=j.calls.filter(c=>!c.cancel); if(cs.length<2) return null;
  let i=-1; for(let k=0;k<cs.length;k++){ if(cs[k].dep!=null && cs[k].dep<=t) i=k; else break; }
  if(i===-1){ // not yet departed from first call in window
    const f=cs[0];
    if(f.arr!=null && f.arr<=t) return {pos:f.ix, at:true, next:0, delay:delayOf(f)};
    if(f.p===0 && f.dep!=null && f.dep-t < 4*60e3) return {pos:f.ix, at:true, wait:true, next:0, delay:delayOf(f)};
    return null;
  }
  if(i===cs.length-1) return null;            // left the last station we know of
  const a=cs[i], b=cs[i+1];
  if(b.arr!=null && b.arr<=t) return {pos:b.ix, at:true, next:i+1, delay:delayOf(b)};
  const span=Math.max(1,(b.arr||b.dep)-a.dep), f=Math.min(1,Math.max(0,(t-a.dep)/span));
  return {pos:a.ix+(b.ix-a.ix)*f, at:false, next:i+1, delay:delayOf(b)};
}
function delayOf(c){ const e=c.arr||c.dep, a=c.aArr||c.aDep; return (e&&a) ? Math.round((e-a)/1000) : 0; }
const dCls = d => d<60?"":d<180?"late":"bad";
const dTxt = d => d<60 ? "0" : (d>0?"+":"")+Math.round(d/60);

function setLive(){
  const el=$("#live"), age=Date.now()-lastOk;
  if(!lastOk){ el.className="live"+(lastErr?" off":""); el.textContent=lastErr?"INGEN DATA":"KOBLER TIL"; return; }
  if(age<POLL_MS*2.5){ el.className="live"; el.textContent="LIVE"; }
  else if(age<5*60e3){ el.className="live stale"; el.textContent=`${Math.round(age/60e3)||1} MIN GAMMEL`; }
  else { el.className="live off"; el.textContent="FRAKOBLET"; }
}

function renderTabs(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));

  document.documentElement.style.setProperty("--c",COLORS[S.line]);
  if(S.tab!=="line" && S.tab!=="net") closeSheet();
  build();
}

const ROW=44;
function buildLine(){

function drawLine(t){
  const box=$("#trains"); if(!box) return;

  for(const j of JOURNEYS){ if(j.line!==S.line) continue;
    const s=stateAt(j,t); if(!s) continue;

    html+=`<button class="train ${s.wait?"wait":""} ${S.sel===j.id?"sel":""}" style="top:${y.toFixed(1)}px;left:calc(100% - ${j.dir===0?117:39}px)" data-j="${esc(j.id)}" aria-label="Tog mot ${esc(j.dest||"")}, ${s.delay<60?"i rute":Math.round(s.delay/60)+" min forsinket"}"><span>${j.dir===0?"▼":"▲"}</span><b class="${dCls(s.delay)}">${dTxt(s.delay)}</b></button>`;

content.addEventListener("pointerdown",e=>{ const b=e.target.closest(".train"); if(!b) return; S.sel=b.dataset.j; tick(); });
sheet.addEventListener("pointerdown",e=>{ if(e.target.closest(".x")) closeSheet(); });
function closeSheet(){ S.sel=null; sheet.hidden=true; }
// Link into the timing logger: same line and direction; start at the station the train is at, or the next one.
function logLink(j,s,cs,st){
  const ix = s.at ? Math.round(s.pos) : cs[s.next].ix;
  if(ix==null || (j.dir===0 ? ix>=st.length-1 : ix<=0)) return "";
  const q=new URLSearchParams({line:j.line, dir:String(j.dir), from:st[ix].name, i:String(ix)});
  return `<a class="logbtn" style="--c:${COLORS[j.line]}" href="tbane.html?${q}">Logg fra ${esc(st[ix].name)}</a>`;
}
function drawSheet(t){
  if(!S.sel){ sheet.hidden=true; return; }
  const j=JOURNEYS.find(x=>x.id===S.sel), s=j&&stateAt(j,t);
  if(!s){ closeSheet(); return; }
  const st=NET.lines[j.line].stations, cs=j.calls.filter(c=>!c.cancel);
  const nxt=cs.slice(s.at?s.next+1:s.next).slice(0,5);
  const head = s.wait ? `Venter på avgang fra ${esc(st[Math.round(s.pos)].name)}` : s.at ? `Står på ${esc(st[Math.round(s.pos)].name)}` : `Mellom ${esc(st[cs[s.next-1].ix].name)} og ${esc(st[cs[s.next].ix].name)}`;
  const first=nxt[0], nIn=first?Math.max(0,Math.round(((first.arr||first.dep)-t)/60e3)):null;
  // arrival at the destination, if the final call is inside the data window
  const last=cs[cs.length-1], lastName=st[last.ix].name, endKnown = j.dest && j.dest.indexOf(lastName)===0 && last.dep==null;
  const dl = s.delay<60 ? "I rute" : `+${Math.round(s.delay/60)} min`;
  const other = S.tab==="net" ? `<button class="sbtn" data-show="line">Vis på linjen</button>` : `<button class="sbtn" data-show="net">Vis på kartet</button>`;
  const html=`<div class="h"><span class="badge" style="background:${COLORS[j.line]}">${j.line}</span><div><b>Mot ${esc(j.dest||st[j.dir===0?st.length-1:0].name)}</b><small>${head}</small></div><button class="x" aria-label="Lukk">✕</button></div>
    <div class="tiles">
      <div><small>Forsinkelse</small><b class="${dCls(s.delay)}">${dl}</b></div>
      <div><small>Neste stopp</small><b>${first?esc(st[first.ix].name):"–"}</b><em>${first?(nIn<1?"nå":`om ${nIn} min`):""}</em></div>
      <div><small>${endKnown?"Fremme":"Endestasjon"}</small><b>${endKnown?hm(last.arr):esc(j.dest?j.dest.split(" via ")[0]:"–")}</b><em>${endKnown?esc(lastName):""}</em></div>
    </div>
    <ol>${nxt.map(c=>`<li><span>${esc(st[c.ix].name)}</span>${c.aArr&&Math.abs((c.arr||0)-c.aArr)>=60e3?`<s>${hm(c.aArr)}</s>`:"<s></s>"}<span class="mono num">${hm(c.arr||c.dep)}</span></li>`).join("")||`<li><span>Siste stasjon</span><s></s><span></span></li>`}</ol>
    <div class="sacts">${other}${logLink(j,s,cs,st)}</div>`;
  if(sheet._html!==html){ sheet.innerHTML=html; sheet._html=html; }   // redraw only on change, so taps on buttons land
  sheet.hidden=false;
}
sheet.addEventListener("click",e=>{ const b=e.target.closest("[data-show]"); if(!b) return;
  const id=S.sel, j=JOURNEYS.find(x=>x.id===id); if(!j) return;
  S.tab=b.dataset.show; store("lb.tab",S.tab);
  if(S.tab==="line"){ S.line=j.line; store("lb.line",S.line); }
  renderTabs(); S.sel=id; tick();
  if(S.tab==="line"){ const tr=content.querySelector(".train.sel"); if(tr) content.scrollTop=Math.max(0,parseFloat(tr.style.top)-140); }
  else focusTrain(id);
});

/* ---------- network map (landscape, pan & zoom) ----------
   Octilinear schematic in landscape, like the maps above the doors: the shared
   tunnel runs across the middle, branches fan out west and east. Each line is a
   polyline through key stations; the stations in between are spread evenly along
   it. Shared track is drawn as parallel lanes in a fixed order. Every station is
   named; labels sit on the open side of the line. World units: 1040 × 540. */
const KEY = {
  // trunk and east (y = 300)
  "Majorstuen":[360,300], "Tøyen":[600,300], "Brynseng":[740,300], "Hellerud":[790,300], "Ellingsrudåsen":[1000,300],
  "Høyenhall":[760,320], "Bergkrystallen":[760,510], "Godlia":[810,320], "Ulsrud":[880,390], "Mortensrud":[880,510],
  // west
  "Smestad":[260,300], "Østerås":[20,300], "Jar":[190,370], "Kolsås":[20,370],
  "Frøen":[330,270], "Slemdal":[330,150], "Frognerseteren":[200,20],
  // north and ring
  "Ullevål stadion":[360,180], "Sognsvann":[360,30], "Sinsen":[560,180], "Carl Berners plass":[560,260],
  "Økern":[640,180], "Vestli":[790,30]
};
const LANE = {"1":-2,"2":-1,"3":0,"4":1,"5":2}, LANEW=3.2, WORLD={x:-20,y:-20,w:1100,h:580};
const INTERCHANGE = new Set(["Majorstuen","Nationaltheatret","Stortinget","Jernbanetorget","Grønland","Tøyen","Ensjø","Helsfyr","Brynseng","Smestad","Ullevål stadion","Sinsen","Økern","Carl Berners plass","Hellerud","Borgen","Forskningsparken","Blindern","Storo","Nydalen"]);
const TERMINI_ALL = new Set(["Østerås","Kolsås","Frognerseteren","Sognsvann","Vestli","Bergkrystallen","Mortensrud","Ellingsrudåsen"]);
let GEO=null, TRAINPOS=[];
function offsetPolyline(pts,d){
  if(!d) return pts.slice();
  // normals point to the same side whichever way the line is drawn, so shared track keeps a fixed lane order
  const nrm=(a,b)=>{ const dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1; let n=[-dy/l,dx/l]; if(n[0]<-1e-9 || (Math.abs(n[0])<1e-9 && n[1]<0)) n=[-n[0],-n[1]]; return n; };
  return pts.map((p,i)=>{
    const n1=i>0?nrm(pts[i-1],p):null, n2=i<pts.length-1?nrm(p,pts[i+1]):null;
    if(!n1) return [p[0]+n2[0]*d,p[1]+n2[1]*d];
    if(!n2) return [p[0]+n1[0]*d,p[1]+n1[1]*d];
    const mx=n1[0]+n2[0], my=n1[1]+n2[1], k=1+n1[0]*n2[0]+n1[1]*n2[1];
    return [p[0]+mx/k*d, p[1]+my/k*d];
  });
}
function buildGeo(){
  GEO={};
  for(const [code,L] of Object.entries(NET.lines)){
    const st=L.stations.map(s=>s.name), keyIdx=[];
    st.forEach((s,i)=>{ if(KEY[s]) keyIdx.push(i); });
    if(keyIdx.length<2) continue;
    const base=new Array(st.length);
    for(let k=0;k<keyIdx.length-1;k++){
      const a=keyIdx[k], b=keyIdx[k+1], A=KEY[st[a]], B=KEY[st[b]];
      for(let i=a;i<=b;i++){ const f=(i-a)/(b-a); base[i]=[A[0]+(B[0]-A[0])*f, A[1]+(B[1]-A[1])*f]; }
    }
    for(let i=0;i<st.length;i++) if(!base[i]) base[i]=KEY[st[i<keyIdx[0]?keyIdx[0]:keyIdx[keyIdx.length-1]]];
    const path=offsetPolyline(keyIdx.map(i=>KEY[st[i]]), LANE[code]*LANEW);
    const off=new Array(st.length);
    for(let k=0;k<keyIdx.length-1;k++){
      const a=keyIdx[k], b=keyIdx[k+1], P=path[k], Q=path[k+1];
      for(let i=a;i<=b;i++){ const f=(i-a)/(b-a); off[i]=[P[0]+(Q[0]-P[0])*f, P[1]+(Q[1]-P[1])*f]; }
    }
    for(let i=0;i<st.length;i++) if(!off[i]) off[i]=base[i];
    GEO[code]={path, pts:off, base};
  }
}
// Label for one station: placed on the open side of its line, rotated 45° on horizontal track (as on door maps).
// hand-placed labels where the general rule collides with a neighbouring line
const LABEL_FIX = {
  "Ullevål stadion": (x,y,h)=>[x+h+5, y+h+11, "start"],
  "Frøen":           (x,y,h)=>[x-h-5, y-2, "end"],
  "Økern":           (x,y,h)=>[x-5, y-h-6, "end"],
  "Borgen":          (x,y,h)=>[x-2, y+h+12, "start"],
  "Høyenhall":       (x,y,h)=>[x-h-5, y+3, "end"],
  "Brynseng":        (x,y,h)=>[x-4, y-h-6, "end"],
  "Carl Berners plass": (x,y,h)=>[x-h-5, y+3, "end"]
};
function labelFor(name, x, y, dx, dy, half, major){
  const t=esc(name), cls=major?"major":"";
  if(LABEL_FIX[name]){ const [lx,ly,an]=LABEL_FIX[name](x,y,half); return `<text class="${cls}" x="${lx}" y="${ly}" text-anchor="${an}">${t}</text>`; }
  const h=Math.abs(dy)<0.3*Math.abs(dx), v=Math.abs(dx)<0.3*Math.abs(dy);
  if(h){
    const below = (y>=295 && y<=305 && x>=300 && x<=750) || y>=360 || name==="Løren";   // trunk and line 3 west: below; the rest above
    if(below){ const ly=y+half+7; return `<text class="${cls}" x="${x-2}" y="${ly}" text-anchor="end" transform="rotate(-45 ${x-2} ${ly})">${t}</text>`; }
    const ly=y-half-6; return `<text class="${cls}" x="${x+2}" y="${ly}" transform="rotate(-45 ${x+2} ${ly})">${t}</text>`;
  }
  if(v){
    const left = x<=340 || (x>=700 && x<=800 && y>300) || (x>=550 && x<=570 && y>185 && y<255);
    return left ? `<text class="${cls}" x="${x-half-5}" y="${y+3}" text-anchor="end">${t}</text>` : `<text class="${cls}" x="${x+half+5}" y="${y+3}">${t}</text>`;
  }
  const slash = (dx>0)!==(dy>0);                                            // "/" or "\"
  if(slash) return `<text class="${cls}" x="${x+half+4}" y="${y+half+8}">${t}</text>`;
  return x<340 ? `<text class="${cls}" x="${x-half-4}" y="${y+half+8}" text-anchor="end">${t}</text>` : `<text class="${cls}" x="${x+half+4}" y="${y-half-3}">${t}</text>`;
}
function buildNet(){
  if(!GEO) buildGeo();
  let lines="", ticks="", labels="";
  for(const code of ["3","2","1","4","5"]){ const g=GEO[code]; if(!g) continue;
    lines+=`<polyline points="${g.path.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="${COLORS[code]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const seen=new Set();
  for(const L of Object.values(NET.lines)) L.stations.forEach(s=>{ if(seen.has(s.name)) return; seen.add(s.name);
    const users=Object.keys(NET.lines).filter(c=>GEO[c]&&NET.lines[c].stations.some(x=>x.name===s.name));
    const pts=users.map(c=>GEO[c].pts[NET.lines[c].stations.findIndex(x=>x.name===s.name)]);
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]), x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
    const cx=(x0+x1)/2, cy=(y0+y1)/2, half=Math.max(x1-x0,y1-y0)/2+2.5;
    const ic=users.length>1 && INTERCHANGE.has(s.name);
    if(ic) ticks+=`<rect x="${(x0-3.4).toFixed(1)}" y="${(y0-3.4).toFixed(1)}" width="${(x1-x0+6.8).toFixed(1)}" height="${(y1-y0+6.8).toFixed(1)}" rx="3.4" fill="#0c0f13" stroke="#eef1f4" stroke-width="1.3"/>`;
    else ticks+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${users.length>1?2.6:2}" fill="#0c0f13" stroke="#eef1f4" stroke-width="1.1"/>`;
    // direction of the track here, from the first line that serves the station (canonical points)
    const c0=users[0], st=NET.lines[c0].stations, i=st.findIndex(x=>x.name===s.name), B=GEO[c0].base;
    const P=B[Math.max(0,i-1)], Q=B[Math.min(st.length-1,i+1)];
    labels+=labelFor(s.name, cx, cy, Q[0]-P[0], Q[1]-P[1], half, ic||TERMINI_ALL.has(s.name));
  });
  content.innerHTML=`<div class="netview">
    <div class="map" id="map"><svg id="netsvg" role="img" aria-label="Linjekart over T-banen med tog i sanntid. Dra for å flytte, knip eller bruk knappene for å zoome.">
      <g id="vp">${lines}${ticks}<g class="lbl">${labels}</g><g id="dots"></g></g></svg>
      <div class="zoom"><button id="zi" aria-label="Zoom inn">+</button><button id="zo" aria-label="Zoom ut">−</button><button id="zf" aria-label="Vis hele kartet">⤢</button></div>
    </div>
    <div class="kpis"><div class="kpi"><small>Tog ute</small><b class="num" id="kT">–</b></div><div class="kpi"><small>Punktlige</small><b class="num" id="kP">–</b></div><div class="kpi"><small>Snitt</small><b class="num" id="kD">–</b></div></div>
  </div>`;
  initPanZoom();
}
function drawNet(t){
  const box=$("#dots"); if(!box) return;
  let html="", sel="", n=0, ok=0, sum=0; TRAINPOS=[];
  for(const j of JOURNEYS){ const g=GEO[j.line]; if(!g) continue; const s=stateAt(j,t); if(!s) continue;
    const i0=Math.floor(s.pos), i1=Math.min(g.pts.length-1,i0+1), f=s.pos-i0, A=g.pts[i0], B=g.pts[i1];
    const x=A[0]+(B[0]-A[0])*f, y=A[1]+(B[1]-A[1])*f;
    TRAINPOS.push({id:j.id,x,y});
    const ring=s.delay>=180?"#ff5d4f":s.delay>=60?"#f0b43c":"#0c0f13";
    const dot=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${COLORS[j.line]}" stroke="${ring}" stroke-width="2.2"/>`;
    if(S.sel===j.id) sel=`<circle class="pulse" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="none" stroke="#eef1f4" stroke-width="2"/>`+dot;
    else html+=dot;
    n++; if(s.delay<180) ok++; sum+=Math.max(0,s.delay);
  }
  box.innerHTML=html+sel;
  $("#kT").textContent=n; $("#kP").textContent=n?Math.round(100*ok/n)+"%":"–";
  const avg=n?sum/n:0; $("#kD").textContent=n?`+${Math.floor(avg/60)}:${pad(Math.round(avg%60))}`:"–";
}

/* pan & zoom: one finger drags, two fingers pinch, wheel zooms, double tap zooms in, tap selects a train */
const VIEW={k:0,tx:0,ty:0};
function initPanZoom(){
  const svg=$("#netsvg"), vp=$("#vp"), map=$("#map");
  const size=()=>{ const r=map.getBoundingClientRect(); return {w:r.width,h:r.height}; };
  const fitK=()=>{ const z=size(); return Math.min(z.w/WORLD.w, z.h/WORLD.h); };
  const apply=()=>{ clamp(); vp.setAttribute("transform",`translate(${VIEW.tx.toFixed(1)} ${VIEW.ty.toFixed(1)}) scale(${VIEW.k.toFixed(4)})`); };
  const clamp=()=>{ const z=size(), kMin=fitK()*0.9; VIEW.k=Math.min(8,Math.max(kMin,VIEW.k));
    const mw=WORLD.w*VIEW.k, mh=WORLD.h*VIEW.k, m=40;
    const lo=(view,map0,len)=> len<=view ? [ (view-len)/2-map0*VIEW.k, (view-len)/2-map0*VIEW.k ] : [ view-m-(map0+len/VIEW.k)*VIEW.k, m-map0*VIEW.k ];
    const [ax,bx]=lo(z.w,WORLD.x,mw), [ay,by]=lo(z.h,WORLD.y,mh);
    VIEW.tx=Math.min(bx,Math.max(ax,VIEW.tx)); VIEW.ty=Math.min(by,Math.max(ay,VIEW.ty)); };
  const zoomAt=(f,sx,sy)=>{ const k0=VIEW.k; VIEW.k=Math.min(8,Math.max(fitK()*0.9,k0*f)); const r=VIEW.k/k0; VIEW.tx=sx-(sx-VIEW.tx)*r; VIEW.ty=sy-(sy-VIEW.ty)*r; apply(); };
  const fitAll=()=>{ const z=size(); VIEW.k=fitK(); VIEW.tx=(z.w-WORLD.w*VIEW.k)/2-WORLD.x*VIEW.k; VIEW.ty=(z.h-WORLD.h*VIEW.k)/2-WORLD.y*VIEW.k; apply(); };
  const home=()=>{ const z=size(); VIEW.k=Math.max(fitK(), z.h/WORLD.h); VIEW.tx=z.w/2-520*VIEW.k; VIEW.ty=(z.h-WORLD.h*VIEW.k)/2-WORLD.y*VIEW.k; apply(); };
  VIEW.center=(x,y,k)=>{ const z=size(); if(k) VIEW.k=Math.max(VIEW.k,k); VIEW.tx=z.w/2-x*VIEW.k; VIEW.ty=z.h*0.38-y*VIEW.k; apply(); };
  if(!VIEW.k) home(); else apply();
  new ResizeObserver(()=>apply()).observe(map);
  $("#zi").onclick=()=>{ const z=size(); zoomAt(1.6,z.w/2,z.h/2); };
  $("#zo").onclick=()=>{ const z=size(); zoomAt(1/1.6,z.w/2,z.h/2); };
  $("#zf").onclick=fitAll;
  svg.addEventListener("wheel",e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0018),e.clientX-r.left,e.clientY-r.top); },{passive:false});
  const P=new Map(); let moved=0, downAt=0, lastTap=0, pinch=null;
  svg.addEventListener("pointerdown",e=>{ svg.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(P.size===1){ moved=0; downAt=performance.now(); } pinch=null; });
  svg.addEventListener("pointermove",e=>{ const p=P.get(e.pointerId); if(!p) return; const r=svg.getBoundingClientRect();
    if(P.size===1){ const dx=e.clientX-p.x, dy=e.clientY-p.y; moved+=Math.abs(dx)+Math.abs(dy); VIEW.tx+=dx; VIEW.ty+=dy; p.x=e.clientX; p.y=e.clientY; apply(); return; }
    p.x=e.clientX; p.y=e.clientY; const [a,b]=[...P.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top; moved=99;
    if(pinch){ VIEW.tx+=mx-pinch.mx; VIEW.ty+=my-pinch.my; zoomAt(d/pinch.d,mx,my); }
    pinch={d,mx,my}; });
  const end=e=>{ if(!P.has(e.pointerId)) return; P.delete(e.pointerId); if(P.size) { pinch=null; return; }
    if(moved>8 || performance.now()-downAt>600) return;
    const r=svg.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top, now=performance.now();
    const wx=(sx-VIEW.tx)/VIEW.k, wy=(sy-VIEW.ty)/VIEW.k;
    let best=null, bd=Math.max(14,22/VIEW.k); for(const tp of TRAINPOS){ const d=Math.hypot(tp.x-wx,tp.y-wy); if(d<bd){ bd=d; best=tp; } }
    if(best){ S.sel=best.id; lastTap=0; tick(); return; }
    if(now-lastTap<320){ zoomAt(1.8,sx,sy); lastTap=0; return; }
    lastTap=now; if(S.sel){ closeSheet(); tick(); } };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",e=>{ P.delete(e.pointerId); pinch=null; });
}
function focusTrain(id){
  const tp=TRAINPOS.find(x=>x.id===id); if(tp && VIEW.center) VIEW.center(tp.x,tp.y,2.2);
}

/* ---------- station index ---------- */
let NAMEOF=null, IDSOF=null, LINESAT=null;
function indexStations(){
  if(NAMEOF) return;
  NAMEOF={}; IDSOF={}; LINESAT={};
  for(const [code,L] of Object.entries(NET.lines)) for(const s of L.stations){
    NAMEOF[s.id]=s.name; (IDSOF[s.name]||(IDSOF[s.name]=new Set())).add(s.id);
    (LINESAT[s.name]||(LINESAT[s.name]=new Set())).add(code);
  }
}

/* ---------- my station ----------
   Departures at the chosen station within the data window (about the next 17 min),
   grouped by the next station the train calls at. Each row says where the train is
   now, computed the same way as on the line view. "Gå om" uses the walking time and
   the pinned direction (★), or the first departure in any direction. */
function departures(name,t){
  const ids=IDSOF[name]; if(!ids) return [];
  const out=[];
  for(const j of JOURNEYS){
    const cs=j.calls.filter(c=>!c.cancel), st=NET.lines[j.line].stations;
    for(let k=0;k<cs.length;k++){ const c=cs[k];
      if(!ids.has(c.stop) || c.dep==null || c.dep<t-15e3) continue;   // no departure here (terminates) or already gone
      const s=stateAt(j,t); let away=null, where="";
      if(s){ const d = j.dir===0 ? c.ix-s.pos : s.pos-c.ix; if(d<-0.05) continue; away=Math.max(0,d);
        where = s.at ? st[Math.round(s.pos)].name : st[cs[s.next-1] ? cs[s.next-1].ix : Math.round(s.pos)].name; }
      // next station from the line's route (the next call may lie outside the data window)
      const nIx = j.dir===0 ? c.ix+1 : c.ix-1, nx=cs[k+1];
      const next = st[nIx] ? st[nIx].name : nx ? NAMEOF[nx.stop] : (j.dest||"");
      out.push({j, c, when:c.dep, delay:delayOf(c), away, at:s&&s.at, wait:s&&s.wait, where, first:NAMEOF[cs[0].stop], next});
      break;
    }
  }
  return out.sort((a,b)=>a.when-b.when);
}
function buildStn(){
  if(!S.stn || !IDSOF[S.stn] || S.picking) return buildPicker();
  content.innerHTML=`<div class="stn" id="stn"></div>`; stnHTML=null;
}
let stnHTML=null;
function drawStn(t){
  const box=$("#stn"); if(!box) return;
  const name=S.stn, all=departures(name,t), groups=new Map();
  for(const d of all){ if(!groups.has(d.next)) groups.set(d.next,[]); groups.get(d.next).push(d); }
  const keys=[...groups.keys()].sort((a,b)=>a.localeCompare(b,"no"));
  const pin=S.pinned[name] && groups.has(S.pinned[name]) ? S.pinned[name] : null;
  const walkMs=S.walk*60e3, pool=(pin?groups.get(pin):all).filter(d=>d.when-walkMs>=t-30e3);
  const target=pool[0], goMin=target?(target.when-walkMs-t)/60e3:null;
  const go = target ? `<div class="go ${goMin<1?"now":""}"><small>${goMin<1?"Gå":"Gå om"}</small><b class="num">${goMin<1?"nå":Math.floor(goMin)+" min"}</b><em>Linje ${esc(target.j.line)} kl. ${hm(target.when)}</em></div>` : `<div class="go"><small>Gå om</small><b>–</b></div>`;
  const row=d=>{
    const m=(d.when-t)/60e3, col=COLORS[d.j.line];
    let pos;
    if(d.away==null) pos = d.first===name ? "starter her" : `venter på avgang fra <i>${esc(d.first)}</i>`;
    else if(d.at && d.away<0.05) pos = "<i>står på stasjonen</i>";
    else { const n=Math.ceil(d.away-1e-6); pos = (n<=1 && !d.at) ? `neste stopp · fra <i>${esc(d.where)}</i>` : `${n} stopp unna · ${d.at?"ved":"fra"} <i>${esc(d.where)}</i>`; }
    const dl = d.delay>=180 ? ` · <span class="bd">+${Math.round(d.delay/60)} min</span>` : d.delay>=60 ? ` · <span class="lt">+${Math.round(d.delay/60)} min</span>` : "";
    const pct = d.away==null ? 0 : Math.max(4, 100-Math.min(100,d.away*12));
    return `<div class="dep"><span class="badge" style="background:${col}">${esc(d.j.line)}</span><span class="t"><b>${esc(d.j.dest||"")}</b><small>${pos}${dl}</small></span>
      <span class="m num ${m<1?"now":""}">${m<1?"nå":Math.floor(m)}${m<1?"":"<small>min</small>"}</span><span class="prog"><i style="width:${pct}%;background:${col}"></i></span></div>`;
  };
  const html=`<div class="fav"><div><b>${esc(name)}</b><button class="chg" id="chg">Bytt stasjon</button></div>${go}</div>
    <div class="walk"><span>Gåtid til stasjonen</span><button id="wm" aria-label="Kortere gåtid">−</button><b class="num">${S.walk} min</b><button id="wp" aria-label="Lengre gåtid">+</button></div>
    ${keys.length ? keys.map(k=>`<div class="grp"><h3><span>Neste stopp ${esc(k)}</span><button data-pin="${esc(k)}" aria-pressed="${pin===k}">${pin===k?"★ Min retning":"☆ Min retning"}</button></h3>${groups.get(k).slice(0,4).map(row).join("")}</div>`).join("")
      : `<p class="none">Ingen avganger de neste minuttene.</p>`}`;
  if(html!==stnHTML){ $("#stn").innerHTML=html; stnHTML=html; }
}
content.addEventListener("click",e=>{
  if(S.tab!=="stn") return;
  const t=e.target;
  if(t.closest("#chg")){ S.picking=true; build(); return; }
  if(t.closest("#wm")){ S.walk=Math.max(0,S.walk-1); store("lb.walk",S.walk); tick(); return; }
  if(t.closest("#wp")){ S.walk=Math.min(30,S.walk+1); store("lb.walk",S.walk); tick(); return; }
  const pb=t.closest("[data-pin]"); if(pb){ const k=pb.dataset.pin; if(S.pinned[S.stn]===k) delete S.pinned[S.stn]; else S.pinned[S.stn]=k; store("lb.pin",S.pinned); tick(); return; }
  const ps=t.closest("[data-stn]"); if(ps){ S.stn=ps.dataset.stn; S.picking=false; store("lb.stn",S.stn);
    S.recent=[S.stn,...S.recent.filter(x=>x!==S.stn)].slice(0,5); store("lb.recent",S.recent); build(); content.scrollTop=0; }
});
function buildPicker(){
  const names=Object.keys(IDSOF).sort((a,b)=>a.localeCompare(b,"no"));
  const item=n=>`<li><button data-stn="${esc(n)}"><span>${esc(n)}</span><span class="dots">${[...LINESAT[n]].sort().map(c=>`<i style="background:${COLORS[c]}"></i>`).join("")}</span></button></li>`;
  const recent=S.recent.filter(n=>IDSOF[n]);
  content.innerHTML=`<div class="picker">
    <label class="label" for="q" style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Velg stasjon</label>
    <input id="q" type="search" placeholder="Søk, for eksempel Tøyen" autocomplete="off" enterkeyhint="search">
    ${recent.length?`<h3>Nylig brukt</h3><ul class="plist">${recent.map(item).join("")}</ul>`:""}
    <h3>Alle stasjoner</h3><ul class="plist" id="all">${names.map(item).join("")}</ul></div>`;
  const q=$("#q"), all=$("#all");
  q.oninput=()=>{ const v=q.value.trim().toLowerCase(); all.querySelectorAll("li").forEach(li=>li.hidden=!!v && !li.textContent.toLowerCase().includes(v)); };
}

/* ---------- stringline (graphic timetable) ----------
   Time runs down, stations across. Each train is a line through its arrival and
   departure at each station: solid up to now, dashed for the forecast. Steep = fast,
   vertical = standing still. Lines bunching together show trains catching up. */
const SEGS = {
  tunnel:{label:"Fellestunnelen", st:["Majorstuen","Nationaltheatret","Stortinget","Jernbanetorget","Grønland","Tøyen"]},
  east:{label:"Tøyen–Brynseng", st:["Tøyen","Ensjø","Helsfyr","Brynseng"]}
};
const SHORT = {"Majorstuen":"Majorst.","Nationaltheatret":"Nat.th.","Stortinget":"Storting.","Jernbanetorget":"Jernb.t.","Grønland":"Grønland","Tøyen":"Tøyen","Ensjø":"Ensjø","Helsfyr":"Helsfyr","Brynseng":"Brynseng"};
function buildSL(){
  if(!SEGS[S.seg]) S.seg="tunnel";
  content.innerHTML=`<div class="sl"><div class="seg" role="group" aria-label="Strekning">${Object.entries(SEGS).map(([k,v])=>`<button data-seg="${k}" aria-pressed="${k===S.seg}">${v.label}</button>`).join("")}</div>
    <svg id="slg" viewBox="0 0 360 560" role="img" aria-label="Grafisk ruteplan for ${esc(SEGS[S.seg].label)}"></svg>
    <div class="lg"><span>Tiden går nedover. Heltrukket er kjørt, stiplet er prognose.</span><span>Bratt linje er kjøring, loddrett er opphold. Linjer som nærmer seg hverandre betyr tog som tar igjen toget foran.</span></div></div>`;
  slLast=0;
}
content.addEventListener("click",e=>{ const b=e.target.closest("[data-seg]"); if(!b) return; S.seg=b.dataset.seg; store("lb.seg",S.seg); build(); });
let slLast=0;
function drawSL(t){
  const svg=$("#slg"); if(!svg || t-slLast<1000) return; slLast=t;
  const seg=SEGS[S.seg].st, W=360, H=560, top=30, bot=10, left=40, right=22, past=8*60e3, fut=14*60e3;
  const xs=i=>left+i*(W-left-right)/(seg.length-1), yt=ts=>top+(ts-(t-past))/(past+fut)*(H-top-bot), yNow=yt(t);
  let g=`<defs><clipPath id="cp"><rect x="0" y="${top-2}" width="${W}" height="${yNow-top+2}"/></clipPath><clipPath id="cf"><rect x="0" y="${yNow}" width="${W}" height="${H-yNow}"/></clipPath></defs>`;
  seg.forEach((n,i)=>{ const an=i===0?"start":i===seg.length-1?"end":"middle", lx=xs(i)+(i===0?-6:i===seg.length-1?6:0);
    g+=`<line x1="${xs(i)}" x2="${xs(i)}" y1="${top-4}" y2="${H-bot}" stroke="#262e38"/><text class="st" x="${lx}" y="14" text-anchor="${an}">${esc(SHORT[n]||n)}</text>`; });
  for(let m=Math.ceil((t-past)/120e3)*120e3; m<=t+fut; m+=120e3){ const y=yt(m); g+=`<line x1="${left-4}" x2="${W-right}" y1="${y}" y2="${y}" stroke="#171c22"/><text x="0" y="${y+3}">${hm(m)}</text>`; }
  const ix={}; seg.forEach((n,i)=>ix[n]=i);
  let lines="";
  for(const j of JOURNEYS){
    const runs=[]; let cur=[];
    for(const c of j.calls){ if(c.cancel) continue; const i=ix[NAMEOF[c.stop]];
      if(i==null){ if(cur.length) runs.push(cur), cur=[]; continue; }
      const a=c.arr!=null?c.arr:c.dep, d=c.dep!=null?c.dep:c.arr; if(a==null) continue;
      cur.push([xs(i),yt(a)],[xs(i),yt(d)]); }
    if(cur.length) runs.push(cur);
    for(const r of runs){ if(r.length<4) continue;
      const pts=r.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
      lines+=`<polyline points="${pts}" fill="none" stroke="${COLORS[j.line]}" stroke-width="2.2" stroke-linejoin="round" clip-path="url(#cp)"/>`
           +`<polyline points="${pts}" fill="none" stroke="${COLORS[j.line]}" stroke-width="1.6" stroke-dasharray="4 3" opacity=".75" clip-path="url(#cf)"/>`; }
  }
  g+=`<svg x="${left-6}" y="${top-4}" width="${W-left-right+12}" height="${H-top-bot+4}" viewBox="${left-6} ${top-4} ${W-left-right+12} ${H-top-bot+4}" overflow="hidden">${lines}</svg>`;
  g+=`<line x1="${left-4}" x2="${W-right}" y1="${yNow}" y2="${yNow}" stroke="#eef1f4" stroke-width="1.4"/><rect x="${W-right-36}" y="${yNow-9}" width="36" height="17" rx="5" fill="#eef1f4"/><text x="${W-right-18}" y="${yNow+3.5}" text-anchor="middle" style="fill:#0c0f13;font-weight:700">NÅ</text>`;
  svg.innerHTML=g;
}

/* ---------- main loop ---------- */
function build(){
  if(!NET){ return; }
  indexStations();
  ({line:buildLine, net:buildNet, stn:buildStn, sl:buildSL})[S.tab]();
  tick();
}
function tick(){
  if(!NET) return;
  const t=Date.now();
  if(S.tab==="line"){ drawLine(t); drawSheet(t); }
  else if(S.tab==="net"){ drawNet(t); drawSheet(t); }
  else if(S.tab==="stn") drawStn(t);
  else drawSL(t);
  if(!JOURNEYS.length && lastOk){
    if(!$("#empty")) content.insertAdjacentHTML("afterbegin",`<div class="msg" id="empty"><b>Ingen tog i trafikk akkurat nå</b>T-banen har nattpause. Togene dukker opp her når driften starter.</div>`);
  } else { const e=$("#empty"); if(e) e.remove(); }
  setLive();
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; store("lb.tab",S.tab); renderTabs(); });
$("#pick").addEventListener("click",e=>{ const b=e.target.closest("[data-l]"); if(!b) return; S.line=b.dataset.l; store("lb.line",S.line); closeSheet(); renderTabs(); content.scrollTop=0; });

let pollTimer=null;
async function poll(){
  clearTimeout(pollTimer);
  if(document.visibilityState!=="visible") return;
  try{ await loadCalls(); lastOk=Date.now(); lastErr=null; }
  catch(e){ lastErr=e; }
  tick();
  pollTimer=setTimeout(poll,POLL_MS);
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") poll(); });
(function frame(){ tick(); setTimeout(()=>requestAnimationFrame(frame),250); })();

(async function boot(){
  try{ await loadNetwork(); }
  catch(e){ content.innerHTML=`<div class="msg"><b>Fikk ikke hentet linjene</b>Sjekk at du er på nett, og prøv igjen. (${esc(e.message)})</div>`; lastErr=e; setLive(); return; }
  if(!NET.lines[S.line]) S.line=Object.keys(NET.lines)[0];
  renderTabs(); poll();
})();

if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost" || location.hostname==="127.0.0.1")){
  navigator.serviceWorker.register("linjeblikk-sw.js",{scope:"./linjeblikk"}).catch(()=>{});
}
</script>
</body>
</html>
